spring.application.name=omnistay-erp

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/omnistay_db
spring.datasource.username=postgres
spring.datasource.password=200420
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/omnistay-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/omnistay-realm/protocol/openid-connect/certs